name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的 tag 时触发，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

# 顶层权限声明 - 确保整个工作流有写入权限
permissions:
  contents: write
  actions: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Linux smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Electron smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:smoke

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux 需要的依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      # 构建应用
      - name: Build Electron app
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package contents
        run: npm run verify:package

      # 修改 latest.yml 中的 URL 指向 GitHub Release（用于从 GitHub 下载安装包）
      - name: Fix latest.yml URLs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # 安装 js-yaml（如果还没有）
          npm install --no-save js-yaml || true
          
          # 执行脚本（脚本文件已存在于项目中）
          node scripts/fix-yaml-urls.js
        env:
          VERSION: ${{ github.ref_name }}

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: ignore

  # 创建 Release 并上传文件
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 下载所有平台的构建产物
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: dist/
        continue-on-error: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: dist/
        continue-on-error: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist/
        continue-on-error: true

      # 列出所有文件（调试用）
      - name: List dist files
        run: ls -la dist/ || echo "No dist folder"

      # 合并所有平台的 yml 文件为一个统一的 latest.yml
      - name: Merge platform yml files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # 安装 js-yaml（如果还没有）
          npm install --no-save js-yaml || true
          
          # 执行合并脚本
          node scripts/merge-yaml-files.js
        env:
          VERSION: ${{ github.ref_name }}

      # 修改合并后的 latest.yml 中的 URL（安装包指向 GitHub，blockmap 指向 Gitee）
      - name: Fix merged latest.yml URLs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # 执行脚本（脚本文件已存在于项目中）
          node scripts/fix-yaml-urls.js
        env:
          VERSION: ${{ github.ref_name }}

      # 创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
        env:
          # 优先使用 PAT，如果没有则回退到 GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # 同步发布到 Gitee（可选，需要配置 GITEE_TOKEN）
      - name: Create Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: yejinxing
          GITEE_REPO: student_app_source
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 发布"
            exit 0
          fi

          VERSION=${GITHUB_REF#refs/tags/}
          echo "Creating Gitee release for $VERSION"

          upload_asset() {
            local file="$1"
            local release_id="$2"
            local filename
            filename=$(basename "$file")

            local existing
            existing=$(curl -fsS \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${release_id}?access_token=${GITEE_TOKEN}" \
              | jq -r ".assets[].name" 2>/dev/null || true)
            if echo "$existing" | grep -Fxq "$filename"; then
              echo "✓ $filename 已存在，跳过"
              return 0
            fi

            local attempt=1
            while [ "$attempt" -le 3 ]; do
              if curl -f -sS -X POST \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${release_id}/attach_files" \
                -H "Authorization: token ${GITEE_TOKEN}" \
                -F "file=@${file}" \
                -F "access_token=${GITEE_TOKEN}"; then
                echo "✓ 上传 $filename"
                return 0
              fi
              echo "上传 $filename 失败（第 ${attempt}/3 次）"
              attempt=$((attempt + 1))
              sleep 2
            done
            echo "::error::上传 $filename 到 Gitee 失败"
            return 1
          }

          RELEASE_ID=$(curl -fsS -X GET \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${VERSION}?access_token=${GITEE_TOKEN}" \
            | jq -r ".id // empty" 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            GITHUB_RELEASE_URL="https://github.com/yejinxing/student_app_source/releases/tag/${VERSION}"
            ORIGINAL_BODY=$(cat RELEASE_NOTES.md)
            DOWNLOAD_NOTE=$(printf "\n\n---\n\n## 下载说明\n\n由于 Gitee 文件大小限制，安装包请通过以下方式下载：\n\n1. 应用内更新：软件会自动使用镜像加速下载\n2. 手动下载：请访问 GitHub Release 页面\n\nGitHub Release: %s" "${GITHUB_RELEASE_URL}")
            FULL_BODY="${ORIGINAL_BODY}${DOWNLOAD_NOTE}"
            BODY=$(echo "$FULL_BODY" | jq -Rs .)

            RELEASE_RESPONSE=$(curl -fsS -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -H "Content-Type: application/json" \
              -d "{
                \"access_token\": \"${GITEE_TOKEN}\",
                \"tag_name\": \"${VERSION}\",
                \"name\": \"${VERSION}\",
                \"body\": ${BODY},
                \"prerelease\": false,
                \"target_commitish\": \"main\"
              }")

            RELEASE_ID=$(echo "${RELEASE_RESPONSE}" | jq -r ".id // empty")
            if [ -z "$RELEASE_ID" ]; then
              echo "::error::创建 Gitee Release 失败: ${RELEASE_RESPONSE}"
              exit 1
            fi
            echo "✓ 已创建 Gitee Release: $RELEASE_ID"
          else
            echo "✓ 使用已有 Gitee Release: $RELEASE_ID"
          fi

          UPLOAD_FAILED=0
          for metadata_file in dist/latest*.yml dist/*.yaml dist/*.blockmap; do
            if [ -f "$metadata_file" ]; then
              if ! upload_asset "$metadata_file" "$RELEASE_ID"; then
                UPLOAD_FAILED=1
              fi
            fi
          done

          if [ "$UPLOAD_FAILED" -ne 0 ]; then
            echo "::error::部分 Gitee 元数据上传失败，差量更新可能不可用"
            exit 1
          fi

          echo "✓ Gitee 元数据上传完成"
