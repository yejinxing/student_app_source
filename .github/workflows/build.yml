name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的 tag 时触发，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

# 顶层权限声明 - 确保整个工作流有写入权限
permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux 需要的依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      # 构建应用
      - name: Build Electron app
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 修改 latest.yml 中的 URL 指向 GitHub Release（用于从 GitHub 下载安装包）
      - name: Fix latest.yml URLs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          GITHUB_BASE_URL="https://github.com/yejinxing/student_app_source/releases/download/${VERSION}"
          
          # 安装 js-yaml（如果还没有）
          npm install --no-save js-yaml || true
          
          # 使用 Node.js 修改 YAML 文件
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const yaml = require('js-yaml');
          
          const version = process.env.VERSION || 'v1.0.0';
          const githubBaseUrl = `https://github.com/yejinxing/student_app_source/releases/download/${version}`;
          
          function fixYamlFile(filePath) {
            if (!fs.existsSync(filePath)) return;
            
            console.log(`修改 ${filePath}...`);
            try {
              const content = fs.readFileSync(filePath, 'utf8');
              const data = yaml.load(content);
              
              // 修改 files 数组中的 url
              if (data.files && Array.isArray(data.files)) {
                data.files.forEach(file => {
                  if (file.url && !file.url.startsWith('http')) {
                    file.url = `${githubBaseUrl}/${file.url}`;
                  }
                  if (file.path) {
                    if (!file.url) {
                      file.url = `${githubBaseUrl}/${file.path}`;
                    }
                    delete file.path;
                  }
                });
              }
              
              // 兼容旧格式：直接在根级别有 path
              if (data.path && !data.path.startsWith('http')) {
                if (!data.url) {
                  data.url = `${githubBaseUrl}/${data.path}`;
                }
                delete data.path;
              }
              
              fs.writeFileSync(filePath, yaml.dump(data, { lineWidth: -1, noRefs: true }), 'utf8');
              console.log(`✅ ${filePath} 已修改`);
            } catch (e) {
              console.error(`修改 ${filePath} 失败:`, e.message);
            }
          }
          
          // 修改所有 latest*.yml 文件
          const distDir = 'dist';
          if (fs.existsSync(distDir)) {
            const files = fs.readdirSync(distDir);
            files.forEach(file => {
              if (file.match(/^latest.*\.yml$/) || file.endsWith('.yaml')) {
                fixYamlFile(path.join(distDir, file));
              }
            });
          }
          EOF
        env:
          VERSION: ${{ github.ref_name }}

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: ignore

  # 创建 Release 并上传文件
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 下载所有平台的构建产物
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: dist/
        continue-on-error: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: dist/
        continue-on-error: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist/
        continue-on-error: true

      # 列出所有文件（调试用）
      - name: List dist files
        run: ls -la dist/ || echo "No dist folder"

      # 创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
        env:
          # 优先使用 PAT，如果没有则回退到 GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # 同步发布到 Gitee（可选，需要配置 GITEE_TOKEN）
      - name: Create Gitee Release
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: yejinxing
          GITEE_REPO: student_app_source
        run: |
          # 检查 GITEE_TOKEN 是否存在
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 发布"
            exit 0
          fi
          
          # 获取版本号
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Creating Gitee release for $VERSION"
          
          # 读取发布说明并添加下载引导
          GITHUB_RELEASE_URL="https://github.com/yejinxing/student_app_source/releases/tag/${VERSION}"
          
          # 读取原始发布说明
          ORIGINAL_BODY=$(cat RELEASE_NOTES.md)
          
          # 构建下载说明（使用 printf 避免 YAML 特殊字符问题）
          DOWNLOAD_NOTE=$(printf '\n\n---\n\n## 下载说明\n\n由于 Gitee 文件大小限制，安装包请通过以下方式下载：\n\n1. 应用内更新：软件会自动使用镜像加速下载\n2. 手动下载：请访问 GitHub Release 页面\n\nGitHub Release: %s' "${GITHUB_RELEASE_URL}")
          
          FULL_BODY="${ORIGINAL_BODY}${DOWNLOAD_NOTE}"
          BODY=$(echo "$FULL_BODY" | jq -Rs .)
          
          # 创建 Release（需要指定 target_commitish）
          RELEASE_RESPONSE=$(curl -s -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${VERSION}\",
              \"name\": \"${VERSION}\",
              \"body\": ${BODY},
              \"prerelease\": false,
              \"target_commitish\": \"main\"
            }")
          
          echo "Gitee Release Response: $RELEASE_RESPONSE"
          
          # 检查是否成功
          RELEASE_ID=$(echo $RELEASE_RESPONSE | jq -r '.id')
          
          if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
            echo "✅ Gitee Release created successfully with ID: $RELEASE_ID"
            echo "Gitee Release URL: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${VERSION}"
            
            # 上传 yml 和 blockmap 文件到 Gitee Release
            echo "开始上传元数据文件到 Gitee..."
            
            # 上传 latest.yml, latest-mac.yml, latest-linux.yml
            for yml_file in dist/latest*.yml dist/*.yaml; do
              if [ -f "$yml_file" ]; then
                filename=$(basename "$yml_file")
                echo "上传 $filename..."
                curl -s -X POST \
                  "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
                  -H "Authorization: token ${GITEE_TOKEN}" \
                  -F "file=@${yml_file}" \
                  -F "access_token=${GITEE_TOKEN}" || echo "上传 $filename 失败（可能已存在）"
              fi
            done
            
            # 上传 blockmap 文件
            for blockmap_file in dist/*.blockmap; do
              if [ -f "$blockmap_file" ]; then
                filename=$(basename "$blockmap_file")
                echo "上传 $filename..."
                curl -s -X POST \
                  "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
                  -H "Authorization: token ${GITEE_TOKEN}" \
                  -F "file=@${blockmap_file}" \
                  -F "access_token=${GITEE_TOKEN}" || echo "上传 $filename 失败（可能已存在）"
              fi
            done
            
            echo "✅ 元数据文件上传完成"
          else
            echo "⚠️ Gitee Release creation failed or already exists"
            echo "Response: $RELEASE_RESPONSE"
            
            # 如果 Release 已存在，尝试获取 Release ID 并上传文件
            EXISTING_RELEASE=$(curl -s -X GET \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${VERSION}?access_token=${GITEE_TOKEN}")
            
            EXISTING_RELEASE_ID=$(echo $EXISTING_RELEASE | jq -r '.id')
            
            if [ "$EXISTING_RELEASE_ID" != "null" ] && [ -n "$EXISTING_RELEASE_ID" ]; then
              echo "找到已存在的 Release，ID: $EXISTING_RELEASE_ID"
              echo "开始上传元数据文件..."
              
              # 上传 yml 和 blockmap 文件
              for yml_file in dist/latest*.yml dist/*.yaml; do
                if [ -f "$yml_file" ]; then
                  filename=$(basename "$yml_file")
                  echo "上传 $filename..."
                  curl -s -X POST \
                    "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${EXISTING_RELEASE_ID}/attach_files" \
                    -H "Authorization: token ${GITEE_TOKEN}" \
                    -F "file=@${yml_file}" \
                    -F "access_token=${GITEE_TOKEN}" || echo "上传 $filename 失败（可能已存在）"
                fi
              done
              
              for blockmap_file in dist/*.blockmap; do
                if [ -f "$blockmap_file" ]; then
                  filename=$(basename "$blockmap_file")
                  echo "上传 $filename..."
                  curl -s -X POST \
                    "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${EXISTING_RELEASE_ID}/attach_files" \
                    -H "Authorization: token ${GITEE_TOKEN}" \
                    -F "file=@${blockmap_file}" \
                    -F "access_token=${GITEE_TOKEN}" || echo "上传 $filename 失败（可能已存在）"
                fi
              done
              
              echo "✅ 元数据文件上传完成"
            fi
          fi

