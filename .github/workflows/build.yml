name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的 tag 时触发，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

# 顶层权限声明 - 确保整个工作流有写入权限
permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux 需要的依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      # 构建应用
      - name: Build Electron app
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: ignore

  # 创建 Release 并上传文件
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 下载所有平台的构建产物
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: dist/
        continue-on-error: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: dist/
        continue-on-error: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist/
        continue-on-error: true

      # 列出所有文件（调试用）
      - name: List dist files
        run: ls -la dist/ || echo "No dist folder"

      # 创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
        env:
          # 优先使用 PAT，如果没有则回退到 GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # 同步发布到 Gitee（可选，需要配置 GITEE_TOKEN）
      - name: Create Gitee Release
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: yejinxing
          GITEE_REPO: student_app_source
        run: |
          # 检查 GITEE_TOKEN 是否存在
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置，跳过 Gitee 发布"
            exit 0
          fi
          
          # 获取版本号
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Creating Gitee release for $VERSION"
          
          # 读取发布说明并添加下载引导
          GITHUB_RELEASE_URL="https://github.com/yejinxing/student_app_source/releases/tag/${VERSION}"
          
          # 在发布说明末尾添加下载引导（使用 heredoc 避免引号问题）
          ORIGINAL_BODY=$(cat RELEASE_NOTES.md)
          
          DOWNLOAD_NOTE=$(cat << 'HEREDOC'

---

## 下载说明

由于 Gitee 文件大小限制，安装包请通过以下方式下载：

1. 应用内更新：软件会自动使用镜像加速下载
2. 手动下载：请访问 GitHub Release 页面
HEREDOC
)
          # 添加 GitHub 链接
          DOWNLOAD_NOTE="${DOWNLOAD_NOTE}

GitHub Release: ${GITHUB_RELEASE_URL}"
          
          FULL_BODY="${ORIGINAL_BODY}${DOWNLOAD_NOTE}"
          BODY=$(echo "$FULL_BODY" | jq -Rs .)
          
          # 创建 Release（需要指定 target_commitish）
          RELEASE_RESPONSE=$(curl -s -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${VERSION}\",
              \"name\": \"${VERSION}\",
              \"body\": ${BODY},
              \"prerelease\": false,
              \"target_commitish\": \"main\"
            }")
          
          echo "Gitee Release Response: $RELEASE_RESPONSE"
          
          # 检查是否成功
          RELEASE_ID=$(echo $RELEASE_RESPONSE | jq -r '.id')
          
          if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
            echo "✅ Gitee Release created successfully with ID: $RELEASE_ID"
            echo "Gitee Release URL: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${VERSION}"
          else
            echo "⚠️ Gitee Release creation failed or already exists"
            echo "Response: $RELEASE_RESPONSE"
          fi

